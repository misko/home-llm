schema_version: 1
id: perf-4090
version: "1.1.0"
description: Repeatable unscored single-user latency and throughput sample for the RTX 4090.
kind: performance
defaults:
  temperature: 0
  top_p: 1
  max_tokens: 128
  seed: 42
warmup_repetitions: 2
repetitions: 5
cases:
  - id: short-prompt-128-output
    messages:
      - role: system
        content: Continue until the requested token budget is reached. Do not use lists.
      - role: user
        content: Explain how content-addressed storage improves reproducibility for local machine-learning artifacts.

  - id: medium-prompt-512-output
    generation:
      temperature: 0
      top_p: 1
      max_tokens: 512
      seed: 42
    messages:
      - role: system
        content: Provide a precise technical analysis.
      - role: user
        content: Compare immutable artifacts, deployment manifests, runtime profiles, benchmark datasets, telemetry, and regression gates. Explain why each must have an independent versioned identity and how they combine to make inference results reproducible.
