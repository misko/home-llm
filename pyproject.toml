[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llm-lab"
version = "0.1.0"
description = "Reproducible local LLM storage, serving, and benchmarking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "huggingface-hub>=0.30,<2",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "psutil>=5.9,<8",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
llmctl = "llm_lab.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_lab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: integration tests that open local sockets or subprocesses",
  "gpu: tests requiring an NVIDIA GPU",
  "network: tests requiring network access",
]

[tool.coverage.run]
branch = true
source = ["llm_lab"]

[tool.coverage.report]
show_missing = true
skip_covered = true
