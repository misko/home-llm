name: llm-lab-research

services:
  searxng:
    # Keep both the human-readable upstream version and the immutable
    # multi-platform manifest digest. Updates are deliberate review events.
    image: docker.io/searxng/searxng:2026.9.5-c7f3080aa@sha256:55e1fa15a63ff04e79e213e6aa2837549877b0c6d60757cdb633ae9111cb5fea
    pull_policy: missing
    restart: unless-stopped
    init: true
    user: "977:977"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      GRANIAN_HOST: "0.0.0.0"
      GRANIAN_PORT: "8080"
      SEARXNG_BASE_URL: "http://127.0.0.1:${SEARXNG_HOST_PORT:-18888}/"
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}"
    ports:
      - name: http
        target: 8080
        published: "${SEARXNG_HOST_PORT:-18888}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: bind
        source: ./config
        target: /etc/searxng
        read_only: true
      - type: volume
        source: searxng-cache
        target: /var/cache/searxng
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:8080/healthz | grep -qx OK
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  searxng-cache:
